<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master — Polla Mundial 2026</title>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: white; min-height: 100vh }

    /* ── NAV ── */
    nav {
      background: #0f172a; padding: 14px 18px 0;
      display: flex; align-items: flex-end; gap: 6px;
      border-bottom: 2px solid #1e293b; position: sticky; top: 0; z-index: 20;
    }
    .tab-btn {
      background: none; border: none; color: #64748b;
      font-size: 14px; font-weight: 700; padding: 8px 16px 10px;
      cursor: pointer; border-radius: 8px 8px 0 0;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
    }
    .tab-btn.active { color: white; border-bottom-color: #f59e0b }
    .tab-btn:hover:not(.active) { color: #94a3b8 }
    .nav-right { margin-left: auto; display: flex; gap: 8px; padding-bottom: 8px }
    .nav-btn {
      background: #1e293b; border: none; color: #94a3b8;
      padding: 6px 13px; border-radius: 7px; font-size: 13px;
      font-weight: 700; cursor: pointer;
    }
    .nav-btn:hover { background: #334155; color: white }
    .nav-btn.primary { background: #16a34a; color: white }
    .nav-btn.primary:hover { background: #15803d }
    .nav-btn.share { background: #3b82f6; color: white }
    .nav-btn.share:hover { background: #2563eb }

    /* ── VIEWS ── */
    .view { display: none; padding: 20px 16px 60px; max-width: 640px; margin: 0 auto }
    .view.active { display: block }

    /* ── UPLOAD (inside score view when empty) ── */
    .dropzone {
      border: 2px dashed #334155; border-radius: 14px;
      padding: 32px 20px; text-align: center; cursor: pointer;
      background: #1e293b; transition: border-color .2s;
      margin-bottom: 20px;
    }
    .dropzone.over { border-color: #3b82f6 }
    .dropzone .icon { font-size: 40px; margin-bottom: 10px }
    .dropzone .dz-title { font-size: 16px; font-weight: 700; margin-bottom: 4px }
    .dropzone .dz-sub { font-size: 13px; color: #64748b }
    .browse { color: #3b82f6; cursor: pointer; text-decoration: underline }

    /* ── SCOREBOARD ── */
    .sb-subtitle { font-size: 13px; color: #64748b; margin-bottom: 14px; text-align: center }
    .rank-list { display: flex; flex-direction: column; gap: 8px }
    .rank-card {
      display: flex; align-items: center; gap: 14px;
      background: #1e293b; border-radius: 12px; padding: 13px 16px;
      cursor: pointer; transition: transform .12s, background .15s;
      border-left: 5px solid var(--c);
    }
    .rank-card:hover { transform: translateX(3px); background: #263147 }
    .rank-pos  { font-size: 20px; width: 30px; text-align: center; flex-shrink: 0 }
    .rank-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--c); color: white;
      font-size: 15px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .rank-info { flex: 1; min-width: 0 }
    .rank-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
    .rank-detail { font-size: 11.5px; color: #64748b; margin-top: 2px }
    .rank-pts-wrap { text-align: right; flex-shrink: 0 }
    .rank-pts { font-size: 26px; font-weight: 900; color: var(--c); line-height: 1 }
    .rank-pts-lbl { font-size: 9px; color: #475569; text-transform: uppercase; letter-spacing: .06em }
    .rank-arrow { color: #334155; font-size: 18px; margin-left: 4px }

    .empty-hint { text-align: center; color: #475569; padding: 30px 0; font-size: 14px }

    /* ── COMPARE VIEW ── */
    #viewCompare { padding: 0 0 60px; max-width: none }
    .cmp-scroll { overflow-x: auto; width: 100% }
    .cmp-table { border-collapse: collapse; font-size: 12px; background: #1e293b; width: 100% }
    .cmp-table thead th {
      background: #0f172a; color: #64748b; padding: 7px 10px;
      font-size: 9px; text-transform: uppercase; letter-spacing: .06em;
      white-space: nowrap;
    }
    .cmp-table thead th.pl-hdr {
      background: var(--c); color: white; font-size: 11px;
      font-weight: 800; text-transform: none; letter-spacing: 0;
      width: 90px; min-width: 90px; max-width: 90px;
      cursor: pointer; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; text-align: center;
      padding: 8px 6px; vertical-align: middle;
    }
    .cmp-table thead th.pl-hdr:hover { opacity: .85 }
    .cmp-table thead .pts-hdr { background: #0f172a; color: #475569; font-size: 9px; width: 38px }
    .cmp-table tbody tr { border-bottom: 1px solid #0f172a }
    .cmp-table tbody tr:last-child { border-bottom: none }
    .cmp-table tbody tr:hover td { filter: brightness(1.15) }
    .cmp-table td { padding: 6px 10px; color: white; vertical-align: middle; white-space: nowrap }
    .cmp-table td.date-c  { color: #475569; font-size: 10px; text-align: center; width: 52px }
    .cmp-table td.match-c { font-weight: 600; min-width: 220px }
    .cmp-table td.res-c   { text-align: center; width: 80px }

    /* Sticky left columns */
    .cmp-sc { position: sticky; z-index: 2 }
    .cmp-sc-0 { left: 0 }
    .cmp-sc-1 { left: 52px }
    .cmp-sc-2 { left: 272px; box-shadow: 3px 0 8px rgba(0,0,0,.5) }
    /* backgrounds for sticky cells per row type */
    .cmp-table tbody tr td.cmp-sc   { background: #1e293b }
    .cmp-table tbody tr:hover td.cmp-sc { background: #263147 }
    .cmp-table .sep-c td.cmp-sc     { background: #0f172a }
    .cmp-table thead th.cmp-sc      { background: #0f172a; z-index: 3 }
    .cmp-table td.pred-c { text-align: center; font-weight: 700; width: 90px }
    .cmp-table td.pts-c  { text-align: center; font-weight: 800; width: 38px; font-size: 11px }
    .cmp-table td.ex { background: #052e16; color: #4ade80 }
    .cmp-table td.co { background: #422006; color: #fb923c }
    .cmp-table td.wr { background: #450a0a; color: #f87171 }
    .cmp-table td.em { color: #334155 }
    .cmp-table .sep-c td { background: #0f172a; color: #f59e0b; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; padding: 4px 10px }
    .cmp-res-input {
      width: 54px; text-align: center;
      background: #0f172a; border: 1.5px solid #334155; border-radius: 6px;
      color: white; font-size: 12px; font-weight: 700;
      padding: 3px; font-family: inherit;
    }
    .cmp-res-input:focus { outline: none; border-color: #3b82f6 }
    .cmp-res-input.filled { border-color: #16a34a; background: #052e16; color: #4ade80 }

    /* ── RESULTS VIEW ── */
    .date-group { margin-bottom: 18px }
    .date-label {
      font-size: 11px; font-weight: 800; color: #f59e0b;
      text-transform: uppercase; letter-spacing: .08em;
      padding: 6px 0 8px;
    }
    .match-row {
      display: flex; align-items: center; gap: 10px;
      background: #1e293b; border-radius: 9px; padding: 8px 12px;
      margin-bottom: 5px;
    }
    .match-teams { flex: 1; font-size: 13px; font-weight: 600; min-width: 0 }
    .match-teams small { color: #64748b; font-weight: 400 }
    .res-input {
      width: 60px; text-align: center; flex-shrink: 0;
      background: #0f172a; border: 1.5px solid #334155; border-radius: 7px;
      color: white; font-size: 13px; font-weight: 700;
      padding: 5px 4px; font-family: inherit;
    }
    .res-input:focus { outline: none; border-color: #3b82f6; background: #1e3a5f }
    .res-input.filled { border-color: #16a34a; background: #052e16; color: #4ade80 }

    /* ── DETAIL VIEW ── */
    .detail-hdr {
      display: flex; align-items: center; gap: 12px;
      background: #1e293b; border-radius: 12px; padding: 14px 16px;
      margin-bottom: 14px; border-left: 5px solid var(--dc);
    }
    .back-btn {
      background: #0f172a; border: none; color: #94a3b8;
      padding: 7px 13px; border-radius: 7px; font-size: 13px;
      font-weight: 700; cursor: pointer; flex-shrink: 0;
    }
    .back-btn:hover { background: #1e293b; color: white }
    .det-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--dc); color: white;
      font-size: 18px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .det-name  { font-size: 17px; font-weight: 800 }
    .det-sub   { font-size: 12px; color: #64748b; margin-top: 2px }
    .det-pts   { margin-left: auto; text-align: right }
    .det-pts-n { font-size: 28px; font-weight: 900; color: var(--dc); line-height: 1 }
    .det-pts-l { font-size: 10px; color: #475569; text-transform: uppercase }

    .det-nav { display: flex; gap: 8px; margin-bottom: 12px }
    .det-nav-btn {
      flex: 1; background: #1e293b; border: none; color: #64748b;
      padding: 8px; border-radius: 8px; font-size: 18px;
      cursor: pointer; font-weight: 700;
    }
    .det-nav-btn:hover:not(:disabled) { background: #334155; color: white }
    .det-nav-btn:disabled { opacity: .3; cursor: not-allowed }

    .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px }
    .leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #64748b }
    .leg-dot { width: 10px; height: 10px; border-radius: 2px }

    /* ── MATCH TABLE ── */
    .tbl-wrap { overflow-x: auto; border-radius: 10px }
    table { border-collapse: collapse; width: 100%; font-size: 13px; background: #1e293b; white-space: nowrap }
    thead th {
      background: #0f172a; color: #64748b;
      padding: 8px 11px; font-size: 10px;
      text-transform: uppercase; letter-spacing: .06em;
    }
    thead th.l { text-align: left }
    thead th.c { text-align: center }
    tbody tr { border-bottom: 1px solid #0f172a }
    tbody tr:last-child { border-bottom: none }
    td { padding: 7px 11px; vertical-align: middle; color: white }
    td.tc { text-align: center }
    td.date-col { color: #475569; font-size: 11px }
    td.match-col { font-weight: 600; min-width: 180px }
    td.pred-col { text-align: center; font-weight: 700; min-width: 65px }
    td.pts-col  { text-align: center; font-weight: 800; width: 46px }
    td.res-col  { text-align: center; width: 75px }

    td.ex { background: #052e16 !important; color: #4ade80 }
    td.co { background: #422006 !important; color: #fb923c }
    td.wr { background: #450a0a !important; color: #f87171 }
    td.em { color: #334155 }
    .pts-ex { color: #4ade80 }
    .pts-co { color: #fb923c }
    .pts-wr { color: #f87171 }
    .pts-bl { color: #334155 }

    .det-res-input {
      width: 56px; text-align: center;
      background: #0f172a; border: 1.5px solid #334155; border-radius: 6px;
      color: white; font-size: 13px; font-weight: 700;
      padding: 4px 3px; font-family: inherit;
    }
    .det-res-input:focus { outline: none; border-color: #3b82f6 }
    .det-res-input.filled { border-color: #16a34a; background: #052e16; color: #4ade80 }

    .sep-row td {
      background: #0f172a; color: #f59e0b;
      font-size: 10px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .07em;
      padding: 5px 11px;
    }

    input[type=file] { display: none }
  </style>
</head>
<body>

<nav>
  <button class="tab-btn active" id="tabBtnScore"   onclick="showTab('score')">🏅 Scoreboard</button>
  <button class="tab-btn"        id="tabBtnResults" onclick="showTab('results')">⚽ Resultados</button>
  <button class="tab-btn"        id="tabBtnCompare" onclick="showTab('compare')">📊 Comparar</button>
  <div class="nav-right">
    <label for="fi" class="nav-btn" style="cursor:pointer">+ Jugadores</label>
    <button class="nav-btn share" id="shareBtn" onclick="shareScoreboard()" style="display:none">⬇️ Descargar Scoreboard</button>
  </div>
</nav>

<!-- Scoreboard tab -->
<div class="view active" id="viewScore">
  <div class="dropzone" id="dz">
    <div class="icon">📂</div>
    <div class="dz-title">Arrastra los Excel aquí</div>
    <div class="dz-sub">o <label for="fi" class="browse">selecciona los archivos</label></div>
  </div>

  <div class="rank-list" id="rankList"></div>
  <div class="empty-hint" id="emptyHint">Sube los archivos Excel para comenzar</div>
</div>

<!-- Results tab -->
<div class="view" id="viewResults" style="max-width:640px;margin:0 auto;padding:20px 16px 60px">
  <div id="resultsGrid"></div>
</div>

<!-- Compare tab -->
<div class="view" id="viewCompare">

</div>

<!-- Detail view (full overlay) -->
<div class="view" id="viewDetail">
  <div class="detail-hdr" id="detHdr" style="--dc:#3b82f6">
    <button class="back-btn" onclick="closeDetail()">← Volver</button>
    <div class="det-avatar" id="detAv"></div>
    <div>
      <div class="det-name" id="detName"></div>
      <div class="det-sub"  id="detSub"></div>
    </div>
    <div class="det-pts">
      <div class="det-pts-n" id="detPts"></div>
      <div class="det-pts-l">puntos</div>
    </div>
  </div>
  <div class="det-nav">
    <button class="det-nav-btn" id="prevBtn" onclick="navDetail(-1)">‹ Anterior</button>
    <button class="det-nav-btn" id="nextBtn" onclick="navDetail(+1)">Siguiente ›</button>
  </div>
  <div class="legend">
    <span class="leg"><span class="leg-dot" style="background:#052e16;border:1px solid #4ade80"></span>Exacto (3)</span>
    <span class="leg"><span class="leg-dot" style="background:#422006;border:1px solid #fb923c"></span>Correcto (1)</span>
    <span class="leg"><span class="leg-dot" style="background:#450a0a;border:1px solid #f87171"></span>Incorrecto</span>
  </div>
  <div class="tbl-wrap"><table id="detTbl"></table></div>
</div>

<input type="file" id="fi" multiple accept=".xlsx">

// ── Scoring ────────────────────────────────────────────────────────────────────
function calcPts(actual,pred){
  if(!actual||!pred) return null
  const norm=s=>s.trim().replace(/\s*-\s*/,'-')
  const a=norm(actual),p=norm(pred)
  if(!a||!p) return null
  if(a===p) return 3
  const[al,av]=a.split('-').map(Number),[pl,pv]=p.split('-').map(Number)
  if([al,av,pl,pv].some(isNaN)) return null
  return Math.sign(al-av)===Math.sign(pl-pv)?1:0
}
function getStats(pl){ let pts=0,exact=0,correct=0; pl.scores.forEach((pred,i)=>{ const p=calcPts(actuals[i],pred); if(p===3){pts+=3;exact++} else if(p===1){pts+=1;correct++} }); return{pts,exact,correct} }
function initials(n){ return n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase() }
function getRanked(){ return players.map((pl,j)=>({...getStats(pl),pl,j})).sort((a,b)=>b.pts-a.pts||b.exact-a.exact) }

// ── File loading ───────────────────────────────────────────────────────────────
function readFile(file){
  return new Promise((res,rej)=>{
    const r=new FileReader()
    r.onload=e=>{ try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'})
      const ws=wb.Sheets[wb.SheetNames[0]]
      const nombre=(ws['B2']?.v||file.name.replace(/\.xlsx$/i,'')).toString().trim()
      const scores=[]
      for(let row=5;row<=76;row++){
        const raw=ws[XLSX.utils.encode_cell({r:row,c:2})]?.v?.toString().trim()||''
        scores.push(raw.replace(/(\d+)\s*-\s*(\d+)/g,'$1-$2'))
      }
      res({nombre,scores,fileName:file.name})
    }catch(err){rej(err)} }
    r.onerror=rej; r.readAsArrayBuffer(file)
  })
}

async function addFiles(files){
  for(const file of files){
    if(!file.name.endsWith('.xlsx')) continue
    if(players.find(p=>p.fileName===file.name)) continue
    try{
      const pl=await readFile(file)
      const sameName=players.filter(p=>p.nombre===pl.nombre)
      if(sameName.length>0) pl.nombre+=` (${file.name.replace(/\.xlsx$/i,'')})`
      pl.color=COLORS[players.length%COLORS.length]
      players.push(pl)
    }catch(e){}
  }
  savePlayers()
  renderAll()
}

function onRes(i,val){
  actuals[i]=val.trim()

  const di=document.getElementById('dri_'+i)
  if(di){ di.value=actuals[i]; di.classList.toggle('filled',!!actuals[i]) }
  saveActuals()
  if(openIdx!==null) refreshDetailRow(i)
  renderScore()
}

function onDetRes(i,val){
  actuals[i]=val.trim()
  const di=document.getElementById('dri_'+i)

  const ri=document.getElementById('ri_'+i)

function refreshDetailRow(i){
  if(openIdx===null) return
  const pred=players[openIdx].scores[i]
  const pts=calcPts(actuals[i],pred)
  const pc=document.getElementById('pc_'+i)
  const pt=document.getElementById('pt_'+i)
  if(pc){ pc.className='pred-col '+(pts===3?'ex':pts===1?'co':pts===0?'wr':pred?'':'em'); pc.textContent=pred||'–' }
  if(pt){ pt.className='pts-col '+(pts===3?'pts-ex':pts===1?'pts-co':pts===0?'pts-wr':'pts-bl'); pt.textContent=pts!==null?pts:'–' }
  const s=getStats(players[openIdx])
  document.getElementById('detSub').textContent=`${s.exact} exactos · ${s.correct} correctos`
  document.getElementById('detPts').textContent=s.pts
}

      <td class="pts-col ${ptc}" id="pt_${i}">${pts!==null?pts:'–'}</td>
    </tr>`
  })
  html+='</tbody>'

  window.scrollTo(0,0)

function calcPts(a,p){if(!a||!p)return null;const nm=s=>s.trim().replace(/\\s*-\\s*/,'-');const an=nm(a),pn=nm(p);if(!an||!pn)return null;if(an===pn)return 3;const[al,av]=an.split('-').map(Number),[pl,pv]=pn.split('-').map(Number);if([al,av,pl,pv].some(isNaN))return null;return Math.sign(al-av)===Math.sign(pl-pv)?1:0}
function stats(pl){let pts=0,ex=0,co=0;pl.scores.forEach((s,i)=>{const p=calcPts(ACTUALS[i],s);if(p===3){pts+=3;ex++}else if(p===1){pts+=1;co++}});return{pts,ex,co}}
const ranked=PLAYERS.map((pl,j)=>({...stats(pl),pl,j})).sort((a,b)=>b.pts-a.pts||b.ex-a.ex);
let openIdx=null,prevTab='S';
function sw(t){
  prevTab=t;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.bnav').style.display='';
  if(t==='S'){document.getElementById('viewScore').classList.add('active');document.getElementById('tS').classList.add('active')}
  else{document.getElementById('viewCompare').classList.add('active');document.getElementById('tC').classList.add('active');renderCmp()}
}
function renderScore(){
  document.getElementById('sbSub').textContent=ACTUALS.filter(a=>a).length+' / 72 partidos jugados';
  document.getElementById('rankList').innerHTML=ranked.map((r,rank)=>'<div class="rank-card" style="--c:'+r.pl.color+'" onclick="open2('+r.j+')">'+'<div class="rank-pos">'+(MEDALS[rank]||'#'+(rank+1))+'</div>'+'<div class="rank-avatar">'+ini(r.pl.nombre)+'</div>'+'<div class="rank-info"><div class="rank-name">'+r.pl.nombre+'</div><div class="rank-detail">'+r.ex+' exactos &middot; '+r.co+' correctos</div></div>'+'<div class="rank-pts-wrap"><div class="rank-pts">'+r.pts+'</div><div class="rank-pts-lbl">pts</div></div>'+'<div class="rank-arrow">›</div></div>').join('');
  const sp=ranked.filter(r=>r.pl.sidePot);
  const spSec=document.getElementById('spSection');
  if(sp.length>0){
    spSec.style.display='';
    document.getElementById('spList').innerHTML=sp.map((r,i)=>'<div class="sp-card" style="--c:'+r.pl.color+'" onclick="open2('+r.j+')">'+'<div class="sp-pos">'+(MEDALS[i]||'#'+(i+1))+'</div>'+'<div class="sp-av">'+ini(r.pl.nombre)+'</div>'+'<div class="sp-info"><div class="sp-name">'+r.pl.nombre+'</div><div class="sp-detail">'+r.ex+' ex · '+r.co+' ok</div></div>'+'<div class="sp-pts">'+r.pts+'</div></div>').join('');
  } else spSec.style.display='none';
}
function open2(idx){
  openIdx=idx;
  const r=ranked.find(r=>r.j===idx),pl=r.pl,s=stats(pl),c=pl.color;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('viewDetail').classList.add('active');
  document.querySelector('.bnav').style.display='none';
  document.getElementById('detHdr').style.setProperty('--dc',c);
  const av=document.getElementById('detAv');av.textContent=ini(pl.nombre);av.style.background=c;
  document.getElementById('detName').textContent=pl.nombre;
  document.getElementById('detSub').textContent=s.ex+' exactos \xb7 '+s.co+' correctos';
  document.getElementById('detPts').textContent=s.pts;
  const pos=ranked.findIndex(r=>r.j===idx);
  document.getElementById('prevBtn').disabled=pos<=0;
  document.getElementById('nextBtn').disabled=pos>=ranked.length-1;
  let h='<thead><tr><th class="l" style="width:50px">Fecha</th><th class="l">Partido</th><th class="c" style="width:72px">Resultado</th><th class="c" style="width:72px">Tu pron.</th><th class="c" style="width:42px">Pts</th></tr></thead><tbody>';
  let ld='';
  PARTIDOS.forEach((m,i)=>{
    if(m.f!==ld){h+='<tr class="sep-row"><td colspan="5">'+m.f+'</td></tr>';ld=m.f}
    const pred=pl.scores[i]||'',res=ACTUALS[i]||'',pts=calcPts(res,pred);
    const pc=pts===3?'ex':pts===1?'co':pts===0?'wr':pred?'':'em';
    const ptc=pts===3?'pts-ex':pts===1?'pts-co':pts===0?'pts-wr':'pts-bl';
    h+='<tr><td class="date-col tc">'+m.f+'</td><td class="match-col">'+fl(m.l)+m.l+' <span style="color:#475569">vs</span> '+fl(m.v)+m.v+'</td><td class="tc" style="font-weight:700">'+(res||'–')+'</td><td class="pred-col '+pc+'">'+(pred||'–')+'</td><td class="pts-col '+ptc+'">'+(pts!==null?pts:'–')+'</td></tr>';
  });
  document.getElementById('detTbl').innerHTML=h+'</tbody>';
  window.scrollTo(0,0);
}
function goBack(){
  openIdx=null;
  document.querySelector('.bnav').style.display='';
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  if(prevTab==='C'){document.getElementById('viewCompare').classList.add('active');document.getElementById('tC').classList.add('active')}
  else{document.getElementById('viewScore').classList.add('active');document.getElementById('tS').classList.add('active')}
}

  th+='</tr></thead>';

    ranked.forEach(r=>{const pred=r.pl.scores[i]||'',pts=calcPts(res,pred);const cl=pts===3?'ex':pts===1?'co':pts===0?'wr':pred?'':'em';const pl2=pts===3?'ex':pts===1?'co':pts===0?'wr':'';tb+='<td class="pred-c '+cl+'">'+(pred||'–')+'</td><td class="pts-c '+pl2+'">'+(pts!==null?pts:'–')+'</td>'});
    tb+='</tr>';
  });
  document.getElementById('cmpTable').innerHTML=th+tb+'</tbody>';
}

// ── Compare view ───────────────────────────────────────────────────────────────
function renderCompare(){
  if(players.length===0){
    document.getElementById('cmpTable').innerHTML='<tr><td style="padding:40px;text-align:center;color:#475569">Sube los archivos Excel para ver la comparación</td></tr>'
    return
  }
  ranked=getRanked()
  const medals=['🥇','🥈','🥉']

  // Single header row: fixed sticky cols + one pred + one pts per player
  let thead='<thead><tr>'
  thead+='<th class="l cmp-sc cmp-sc-0">Fecha</th>'
  thead+='<th class="l cmp-sc cmp-sc-1">Partido</th>'
  thead+='<th class="c cmp-sc cmp-sc-2" style="width:80px">Resultado</th>'
  ranked.forEach((r,rank)=>{
    thead+=`<th class="pl-hdr" style="--c:${r.pl.color}" title="${r.pl.nombre} — ${r.pts} pts" onclick="openDetail(${r.j})">${r.pl.nombre}</th>`
    thead+=`<th class="pts-hdr c">Pts</th>`
  })
  thead+='</tr></thead>'

  // Body
  let tbody='<tbody>'
  let lastDate=''
  PARTIDOS.forEach((m,i)=>{
    if(m.f!==lastDate){
      lastDate=m.f
    }
    const res=actuals[i]||''
    tbody+=`<tr>
      <td class="date-c cmp-sc cmp-sc-0">${m.f}</td>
      <td class="match-c cmp-sc cmp-sc-1">${fl(m.l)}${m.l} <span style="color:#475569">vs</span> ${fl(m.v)}${m.v}</td>
      <td class="res-c cmp-sc cmp-sc-2"><input class="cmp-res-input${res?' filled':''}" id="cri_${i}" value="${res}" placeholder="0-0" oninput="onCmpRes(${i},this.value)"></td>`
    ranked.forEach(r=>{
      const pred=r.pl.scores[i]||''
      const pts=calcPts(res,pred)
      const cls=pts===3?'ex':pts===1?'co':pts===0?'wr':pred?'':'em'
      const ptCls=pts===3?'ex':pts===1?'co':pts===0?'wr':''
      tbody+=`<td class="pred-c ${cls}" id="cp_${r.j}_${i}">${pred||'–'}</td>`
      tbody+=`<td class="pts-c ${ptCls}" id="cpt_${r.j}_${i}">${pts!==null?pts:'–'}</td>`
    })
    tbody+='</tr>'
  })
  tbody+='</tbody>'
  document.getElementById('cmpTable').innerHTML=thead+tbody
}

function onCmpRes(i,val){
  actuals[i]=val.trim()
  const inp=document.getElementById('cri_'+i)
  if(inp) inp.classList.toggle('filled',!!actuals[i])
  // sync other views
  const ri=document.getElementById('ri_'+i)
  if(ri){ ri.value=actuals[i]; ri.classList.toggle('filled',!!actuals[i]) }
  const di=document.getElementById('dri_'+i)
  if(di){ di.value=actuals[i]; di.classList.toggle('filled',!!actuals[i]) }
  saveActuals()
  // update all player cells in compare table
  ranked.forEach(r=>{
    const pred=r.pl.scores[i]||''
    const pts=calcPts(actuals[i],pred)
    const cls=pts===3?'ex':pts===1?'co':pts===0?'wr':pred?'':'em'
    const ptCls=pts===3?'ex':pts===1?'co':pts===0?'wr':''
    const pc=document.getElementById(`cp_${r.j}_${i}`)
    const pt=document.getElementById(`cpt_${r.j}_${i}`)
    if(pc){ pc.className=`pred-c ${cls}`; pc.textContent=pred||'–' }
    if(pt){ pt.className=`pts-c ${ptCls}`; pt.textContent=pts!==null?pts:'–' }
  })
  if(openIdx!==null) refreshDetailRow(i)
  renderScore()
}
