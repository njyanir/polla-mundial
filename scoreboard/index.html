<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Polla 2026">
<title>🏆 Polla Mundial 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f172a;color:white;min-height:100vh;padding-bottom:calc(64px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
.hdr{background:#0f172a;border-bottom:1px solid #1e293b;padding:12px 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.hdr-title{font-size:17px;font-weight:900;letter-spacing:.04em;flex:1}
.hdr-badge{font-size:11px;color:#64748b;font-weight:600;flex-shrink:0}
.hdr-ts{font-size:10px;color:#475569;width:100%;padding-top:2px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#0a1628;border-top:1.5px solid #1e293b;display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:#475569;cursor:pointer;padding:9px 0 10px;min-height:56px}
.bnav-btn.active{color:#f59e0b}
.bnav-icon{font-size:22px;line-height:1}
.bnav-label{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.view{display:none;padding:16px 14px 16px;max-width:640px;margin:0 auto}
.view.active{display:block}
#viewDetail{max-width:640px}
#viewCompare{padding:0;max-width:none}
#cmpWrap{display:flex;align-items:flex-start;overflow-y:auto;overflow-x:hidden;max-height:calc(100vh - 120px);-webkit-overflow-scrolling:touch}
#cmpLeft{flex-shrink:0;overflow:hidden}
#cmpRight{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
#cmpTL,#cmpTR{border-collapse:collapse;font-size:12px;white-space:nowrap}
#cmpTL td,#cmpTL th,#cmpTR td,#cmpTR th{padding:7px 10px;vertical-align:middle;border-bottom:1px solid #0f172a}
#cmpTL th,#cmpTR th{background:#0f172a;color:#64748b;font-size:9px;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0;z-index:3}
#cmpTL td{background:#1e293b;color:#e2e8f0}
#cmpTR td{background:#1e293b;color:#e2e8f0}
#cmpTL tr:last-child td,#cmpTR tr:last-child td{border-bottom:none}
.cmpL-date{color:#475569;font-size:10px;width:50px;text-align:center}
.cmpL-match{font-weight:600;min-width:160px}
.cmpL-res{text-align:center;width:65px;font-weight:700}
.cmp-sep td{background:#0f172a!important;color:#f59e0b;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:4px 10px}
.sb-sub{font-size:12px;color:#64748b;margin-bottom:12px;text-align:center}
.rank-list{display:flex;flex-direction:column;gap:7px}
.rank-card{display:flex;align-items:center;gap:12px;background:#1e293b;border-radius:14px;padding:12px 14px;cursor:pointer;border-left:5px solid var(--c);-webkit-tap-highlight-color:transparent}
.rank-pos{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.rank-avatar{width:40px;height:40px;border-radius:50%;background:var(--c);color:white;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rank-info{flex:1;min-width:0}
.rank-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-detail{font-size:11px;color:#64748b;margin-top:2px}
.rank-pts-wrap{text-align:right;flex-shrink:0}
.rank-pts{font-size:26px;font-weight:900;color:var(--c);line-height:1}
.rank-pts-lbl{font-size:9px;color:#475569;text-transform:uppercase;letter-spacing:.06em}
.rank-arrow{color:#334155;font-size:18px;margin-left:4px}
.score-cols{display:flex;gap:14px;align-items:flex-start}
.score-main{flex:1;min-width:0}
.det-hdr{display:flex;align-items:center;gap:12px;background:#1e293b;border-radius:14px;padding:14px 14px;margin-bottom:12px;border-left:5px solid var(--dc)}
.back-btn{background:#0f172a;border:none;color:#94a3b8;padding:10px 14px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0;min-height:44px}
.det-avatar{width:44px;height:44px;border-radius:50%;background:var(--dc);color:white;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.det-name{font-size:17px;font-weight:800}
.det-sub{font-size:12px;color:#64748b;margin-top:2px}
.det-pts{margin-left:auto;text-align:right}
.det-pts-n{font-size:28px;font-weight:900;color:var(--dc);line-height:1}
.det-pts-l{font-size:10px;color:#475569;text-transform:uppercase}
.det-nav{display:flex;gap:8px;margin-bottom:12px}
.det-nav-btn{flex:1;background:#1e293b;border:none;color:#64748b;padding:12px 8px;border-radius:10px;font-size:18px;cursor:pointer;font-weight:700;min-height:48px}
.det-nav-btn:active{background:#334155;color:white}
.det-nav-btn:disabled{opacity:.3}
.det-meta{background:#1e293b;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.det-meta-item label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#475569;display:block;margin-bottom:2px}
.det-meta-item span{font-size:13px;font-weight:700;color:white}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:#64748b}
.leg-dot{width:10px;height:10px;border-radius:2px}
.tbl-wrap{overflow-x:auto;border-radius:10px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;background:#1e293b;white-space:nowrap}
thead th{background:#0f172a;color:#64748b;padding:8px 11px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0}
thead th.l{text-align:left}
thead th.c{text-align:center}
tbody tr{border-bottom:1px solid #0f172a}
tbody tr:last-child{border-bottom:none}
td{padding:8px 11px;vertical-align:middle;color:white}
td.tc{text-align:center}
td.date-col{color:#475569;font-size:11px}
td.match-col{font-weight:600;min-width:180px}
td.pred-col{text-align:center;font-weight:700;min-width:65px}
td.pts-col{text-align:center;font-weight:800;width:46px}
td.ex{background:#052e16!important;color:#4ade80}
td.co{background:#422006!important;color:#fb923c}
td.wr{background:#450a0a!important;color:#f87171}
td.em{color:#334155}
.pts-ex{color:#4ade80}.pts-co{color:#fb923c}.pts-wr{color:#f87171}.pts-bl{color:#334155}
.sep-row td{background:#0f172a;color:#f59e0b;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:5px 11px}
.cmp-scroll{overflow-x:auto;overflow-y:visible;width:100%;-webkit-overflow-scrolling:touch;position:relative}
.cmp-table{border-collapse:collapse;font-size:12px;background:#1e293b;width:auto}
.cmp-table thead th{background:#0f172a;color:#64748b;padding:7px 10px;font-size:9px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.cmp-table thead th.pl-hdr{background:var(--c);color:white;font-size:11px;font-weight:800;text-transform:none;letter-spacing:0;width:80px;min-width:80px;max-width:80px;cursor:pointer;white-space:normal;word-break:break-word;text-align:center;line-height:1.3;padding:8px 5px;vertical-align:middle}
.cmp-table thead th.pl-hdr:active{opacity:.85}
.cmp-table thead .pts-hdr{background:#0f172a;color:#475569;font-size:9px;width:34px}
.cmp-table tbody tr{border-bottom:1px solid #0f172a}
.cmp-table tbody tr:last-child{border-bottom:none}
.cmp-table td{padding:7px 10px;color:white;vertical-align:middle;white-space:nowrap}
.cmp-table td.date-c{color:#475569;font-size:10px;text-align:center;width:48px}
.cmp-table td.match-c{font-weight:600;min-width:170px}
.cmp-table td.res-c{text-align:center;width:70px;font-weight:700}
.cmp-table td.pred-c{text-align:center;font-weight:700;width:80px}
.cmp-table td.pts-c{text-align:center;font-weight:800;width:34px;font-size:11px}
.cmp-table td.ex{background:#052e16;color:#4ade80}
.cmp-table td.co{background:#422006;color:#fb923c}
.cmp-table td.wr{background:#450a0a;color:#f87171}
.cmp-table td.em{color:#334155}
.cmp-table .sep-c td{background:#0f172a;color:#f59e0b;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:4px 10px}
.cmp-sc{position:relative;z-index:2;will-change:transform}
.cmp-sc-0{left:0}.cmp-sc-1{left:48px}.cmp-sc-2{left:218px;box-shadow:3px 0 8px rgba(0,0,0,.5)}
.cmp-table tbody tr td.cmp-sc{background:#1e293b}
.cmp-table .sep-c td.cmp-sc{background:#0f172a}
.cmp-table thead th.cmp-sc{background:#0f172a;z-index:7}
.res-date-group{margin-bottom:16px}
.res-date-lbl{font-size:11px;font-weight:800;color:#f59e0b;text-transform:uppercase;letter-spacing:.08em;padding:6px 0 8px}
.res-match-row{display:flex;align-items:center;gap:10px;background:#1e293b;border-radius:8px;padding:8px 12px;margin-bottom:4px}
.res-teams{flex:1;font-size:13px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-inp{width:62px;text-align:center;flex-shrink:0;background:#0f172a;border:1.5px solid #334155;border-radius:7px;color:white;font-size:13px;font-weight:700;padding:5px 4px;font-family:inherit}
.res-inp:focus{outline:none;border-color:#3b82f6;background:#1e3a5f}
.res-inp.filled{border-color:#16a34a;background:#052e16;color:#4ade80}
.res-inp.invalid{border-color:#ef4444;background:#450a0a;color:#f87171}
.upd-btn{background:#16a34a;color:white;border:none;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;flex-shrink:0;min-height:36px}
.upd-btn:disabled{opacity:.6;cursor:wait}
</style>
</head>

<div class="hdr">
  <div class="hdr-title">🏆 Polla 2026</div>
  <div class="hdr-badge" id="hdrBadge">0/72 partidos · jueves, 11 de junio</div>
  <button class="upd-btn" id="updBtn" onclick="fetchResults()">🔄 Actualizar</button>
  <div class="hdr-ts" id="hdrTs">Actualizado: 11/06/2026, 13:02</div>

</div>
<div class="view" id="viewRes"><div id="resGrid" style="padding:12px 14px 16px"></div></div>
<nav class="bnav">

  <button class="bnav-btn" id="tR" onclick="sw('R')">

  <button class="bnav-btn" id="tC" onclick="sw('C')">

  </button>
</nav>

  else if(t==='R'){document.getElementById('viewRes').classList.add('active');document.getElementById('tR').classList.add('active');renderRes()}
  else{document.getElementById('viewCompare').classList.add('active');document.getElementById('tC').classList.add('active');renderCmp()}
}
function renderScore(){
  ranked=getRanked();
  document.getElementById('sbSub').textContent=actuals.filter(a=>a).length+' / 72 partidos jugados';
  document.getElementById('rankList').innerHTML=ranked.map((r,rank)=>'<div class="rank-card" style="--c:'+r.pl.color+'" onclick="open2('+r.j+')">'+'<div class="rank-pos">'+(MEDALS[rank]||'#'+(rank+1))+'</div>'+'<div class="rank-avatar">'+ini(r.pl.nombre)+'</div>'+'<div class="rank-info"><div class="rank-name">'+r.pl.nombre+'</div><div class="rank-detail">'+r.ex+' exactos &middot; '+r.co+' correctos</div></div>'+'<div class="rank-pts-wrap"><div class="rank-pts">'+r.pts+'</div><div class="rank-pts-lbl">pts</div></div>'+'<div class="rank-arrow">›</div></div>').join('');
}
function open2(idx){
  openIdx=idx;
  const r=ranked.find(r=>r.j===idx),pl=r.pl,s=stats(pl),c=pl.color;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('viewDetail').classList.add('active');
  document.querySelector('.bnav').style.display='none';
  document.getElementById('detHdr').style.setProperty('--dc',c);
  const av=document.getElementById('detAv');av.textContent=ini(pl.nombre);av.style.background=c;
  document.getElementById('detName').value=pl.nombre;
  document.getElementById('detSub').textContent=s.ex+' exactos \xb7 '+s.co+' correctos';
  document.getElementById('detPts').textContent=s.pts;
  const metaItems=[{label:'Entry ID',val:pl.entryId||'\u2014'},{label:'C\u00f3digo',val:pl.verifyCode||'\u2014'},{label:'Celular',val:pl.celular||'\u2014'},{label:'Enviado',val:'\u2014'}];
  document.getElementById('detMeta').innerHTML=metaItems.map(m=>'<div class="det-meta-item"><label>'+m.label+'</label><span>'+m.val+'</span></div>').join('');
  const pos=ranked.findIndex(r=>r.j===idx);
  document.getElementById('prevBtn').disabled=pos<=0;
  document.getElementById('nextBtn').disabled=pos>=ranked.length-1;
  let h='<thead><tr><th class="l" style="width:50px">Fecha</th><th class="l">Partido</th><th class="c" style="width:72px">Resultado</th><th class="c" style="width:72px">Tu pron.</th><th class="c" style="width:42px">Pts</th></tr></thead><tbody>';
  let ld='';
  PARTIDOS.forEach((m,i)=>{
    if(m.f!==ld){h+='<tr class="sep-row"><td colspan="5">'+m.f+'</td></tr>';ld=m.f}
    const pred=pl.scores[i]||'',res=actuals[i]||'',pts=calcPts(res,pred);
    const pc=pts===3?'ex':pts===1?'co':pts===0?'wr':pred?'':'em';
    const ptc=pts===3?'pts-ex':pts===1?'pts-co':pts===0?'pts-wr':'pts-bl';
    h+='<tr><td class="date-col tc">'+m.f+'</td><td class="match-col">'+fl(m.l)+m.l+' <span style="color:#475569">vs</span> '+fl(m.v)+m.v+'</td><td class="tc" style="font-weight:700">'+(res||'\u2013')+'</td><td class="pred-col '+pc+'">'+(pred||'\u2013')+'</td><td class="pts-col '+ptc+'">'+(pts!==null?pts:'\u2013')+'</td></tr>';
  });
  document.getElementById('detTbl').innerHTML=h+'</tbody>';
  window.scrollTo(0,0);
}
function goBack(){
  openIdx=null;
  document.querySelector('.bnav').style.display='';
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  if(prevTab==='C'){document.getElementById('viewCompare').classList.add('active');document.getElementById('tC').classList.add('active')}
  else if(prevTab==='R'){document.getElementById('viewRes').classList.add('active');document.getElementById('tR').classList.add('active');renderRes()}
  else{document.getElementById('viewScore').classList.add('active');document.getElementById('tS').classList.add('active')}
}
function nav(dir){const pos=ranked.findIndex(r=>r.j===openIdx);const np=pos+dir;if(np<0||np>=ranked.length)return;open2(ranked[np].j)}
function renderCmp(){
  var thL='<thead><tr><th class="cmpL-date">Fecha</th><th class="cmpL-match">Partido</th><th class="cmpL-res">Res.</th></tr></thead><tbody>';
  var thR='<thead><tr>';
  ranked.forEach(r=>{thR+='<th style="background:'+r.pl.color+';color:white;padding:8px 10px;font-size:11px;font-weight:800;min-width:65px;text-align:center;cursor:pointer" onclick="open2('+r.j+')">'+r.pl.nombre+'</th><th style="color:'+r.pl.color+';width:34px;text-align:center">Pts</th>'});
  thR+='</tr></thead><tbody>';
  PARTIDOS.forEach((m,i)=>{
    const res=actuals[i]||'';
    const sepStyle='background:#0f172a;color:#f59e0b;font-size:9px;font-weight:800;text-transform:uppercase;padding:4px 10px;letter-spacing:.07em';
    thL+='<tr><td class="cmpL-date">'+m.f+'</td><td class="cmpL-match">'+fl(m.l)+sn(m.l)+' <span style="color:#475569">vs</span> '+fl(m.v)+sn(m.v)+'</td><td class="cmpL-res">'+(res||'\u2013')+'</td></tr>';
    thR+='<tr>';
    ranked.forEach(r=>{const pred=r.pl.scores[i]||'',pts=calcPts(res,pred);const cl=pts===3?'ex':pts===1?'co':pts===0?'wr':pred?'':'em';const pc=pts===3?'ex':pts===1?'co':pts===0?'wr':'';thR+='<td class="pred-c '+cl+'" style="text-align:center;font-weight:700">'+(pred||'\u2013')+'</td><td class="pts-c '+pc+'" style="text-align:center;font-weight:800;font-size:11px">'+(pts!==null?pts:'\u2013')+'</td>'});
    thR+='</tr>';
  });
  document.getElementById('cmpTL').innerHTML=thL+'</tbody>';
  document.getElementById('cmpTR').innerHTML=thR+'</tbody>';
}
function isValid(s){return /^d{1,2}-d{1,2}$/.test(s.trim())}
function normR(s){return s.trim().replace(/s*-s*/g,'-')}
function onRes(i,val){
  var n=normR(val),inp=document.getElementById('ri_'+i);
  if(val===''){actuals[i]='';if(inp){inp.classList.remove('filled','invalid')}}
  else if(isValid(n)){actuals[i]=n;if(inp){inp.classList.add('filled');inp.classList.remove('invalid')}}
  else{if(inp)inp.classList.add('invalid');return}
  try{localStorage.setItem('p26-actuals',JSON.stringify(actuals))}catch(e){}
  renderScore();
  if(document.getElementById('viewCompare').classList.contains('active'))renderCmp();
}
function onResBlur(i,val){
  if(!val)return;
  var n=normR(val),inp=document.getElementById('ri_'+i);
  if(isValid(n)){if(inp){inp.value=n;inp.classList.remove('invalid')}onRes(i,n)}
}
function renderRes(){
  var html='',ld='';
  PARTIDOS.forEach(function(m,i){
    if(m.f!==ld){if(ld)html+='</div>';html+='<div class="res-date-group"><div class="res-date-lbl">'+m.f+'</div>';ld=m.f}
    var val=actuals[i]||'';
    html+='<div class="res-match-row"><div class="res-teams">'+fl(m.l)+m.l+' <small>vs</small> '+fl(m.v)+m.v+'</div><input class="res-inp'+(val?' filled':'')+'" id="ri_'+i+'" value="'+val+'" placeholder="0-0" oninput="onRes('+i+',this.value)" onblur="onResBlur('+i+',this.value)"></div>';
  });
  if(ld)html+='</div>';
  document.getElementById('resGrid').innerHTML=html;
}
var TEAM_FIX={'BOSNIA-HERZEGOVINA':'BOSNIA AND HERZEGOVINA','CURA\u00c7AO':'CURACAO','T\u00dcRKIYE':'TURKIYE','UNITED STATES':'USA','CZECH REPUBLIC':'CZECHIA','DR CONGO':'CONGO DR','COTE D\'IVOIRE':'IVORY COAST'};
function tnorm(n){n=(n||'').toUpperCase().trim();return TEAM_FIX[n]||n}
var PAIR_IDX={};
PARTIDOS.forEach(function(m,i){PAIR_IDX[[m.l,m.v].slice().sort().join('|')]=i});
function refreshViews(){
  renderScore();
  if(document.getElementById('viewCompare').classList.contains('active'))renderCmp();
  if(document.getElementById('viewRes').classList.contains('active'))renderRes();
  if(openIdx!==null&&document.getElementById('viewDetail').classList.contains('active'))open2(openIdx);
}
function fetchResults(){
  var btn=document.getElementById('updBtn');
  if(btn){btn.disabled=true;btn.textContent='\u23f3 Actualizando...'}
  fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=20260611-20260628&limit=100')
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(function(d){
    var updated=0;
    (d.events||[]).forEach(function(e){
      var c=e.competitions&&e.competitions[0];if(!c)return;
      var st=c.status&&c.status.type;if(!st||!st.completed)return;
      var home=null,away=null,hs=null,as=null;
      (c.competitors||[]).forEach(function(t){
        var nm=tnorm(t.team&&(t.team.displayName||t.team.name));
        if(t.homeAway==='home'){home=nm;hs=t.score}else{away=nm;as=t.score}
      });
      if(!home||!away)return;
      var idx=PAIR_IDX[[home,away].sort().join('|')];
      if(idx===undefined)return;
      var res=PARTIDOS[idx].l===home?hs+'-'+as:as+'-'+hs;
      if(/^\d+-\d+$/.test(res)&&actuals[idx]!==res){actuals[idx]=res;updated++}
    });
    try{localStorage.setItem('p26-actuals',JSON.stringify(actuals))}catch(e){}
    refreshViews();
    var done=actuals.filter(function(a){return a}).length;
    var badge=document.getElementById('hdrBadge');if(badge)badge.textContent=done+'/72 partidos';
    var ts=document.getElementById('hdrTs');if(ts)ts.textContent='Actualizado: '+new Date().toLocaleString('es-ES');
    if(btn){
      btn.disabled=false;
      btn.textContent=updated>0?'\u2713 '+updated+' resultado'+(updated!==1?'s':'')+' nuevo'+(updated!==1?'s':''):'\u2713 Al d\u00eda';
      setTimeout(function(){btn.textContent='\ud83d\udd04 Actualizar'},3000);
    }
  })
  .catch(function(){
    if(btn){btn.disabled=false;btn.textContent='\u26a0\ufe0f Sin conexi\u00f3n';setTimeout(function(){btn.textContent='\ud83d\udd04 Actualizar'},3000)}
  });
}
renderScore();
fetchResults();
setInterval(fetchResults,5*60*1000);
</script>
